<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05241e" />
      <stop offset="100%" stop-color="#0c4338" />
    </linearGradient>
    <linearGradient id="goldMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#34d399" stroke-width="1.8" stroke-opacity="0.75" />
  
  <!-- Subtle Inner Border -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="12.5" fill="none" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.3" />

  <!-- Monogram Initials "AR" -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M 17 46 L 24.5 21 L 29.5 21 L 37 46 L 31.8 46 L 30 39.5 L 23.8 39.5 L 22 46 Z M 25 35.2 L 28.8 35.2 L 26.9 27.5 Z" fill="url(#goldMintGrad)" />
    
    <!-- Letter R -->
    <path d="M 36 21 L 45.5 21 C 49.5 21 52 23.2 52 27 C 52 29.8 50.2 31.8 47.5 32.5 L 53 46 L 47.5 46 L 42.5 33.5 L 40.8 33.5 L 40.8 46 L 36 46 Z M 40.8 29.8 L 45 29.8 C 46.8 29.8 47.8 28.8 47.8 27 C 47.8 25.2 46.8 24.5 45 24.5 L 40.8 24.5 Z" fill="url(#goldMintGrad)" />
  </g>

  <!-- Small Elegant Crown / Diamond Accent Top Center -->
  <path d="M 32 8 L 34.5 12.5 L 32 14.5 L 29.5 12.5 Z" fill="#6ee7b7" opacity="0.9" />
</svg>
